name: Android startup smoke (emulator)

on:
  workflow_dispatch:
  push:
    branches: [fix/android-startup-crash]
    paths:
      - 'android-steps/**'
      - '.github/workflows/android-startup-check.yml'

permissions:
  contents: read

jobs:
  launch-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build
        run: gradle -p android-steps :app:assembleDebug --no-daemon
      - name: Start Android emulator, install and open FitnessDex
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb shell input keyevent 82
            adb install -r android-steps/app/build/outputs/apk/debug/app-debug.apk
            echo "=== Browser availability ==="
            adb shell pm list packages | grep -Ei 'chrome|browser' || true
            adb logcat -c
            echo "=== Launch FitnessDex ==="
            adb shell am start -W -n io.github.gy8s.fitnessdex.steps/.FitnessDexLauncherActivity || true
            sleep 12
            echo "=== Foreground activity ==="
            adb shell dumpsys activity activities | grep -E 'ResumedActivity|topResumedActivity|mResumedActivity|fitnessdex|chrome' | head -60 || true
            echo "=== Runtime errors ==="
            adb logcat -d -v time -s AndroidRuntime:E | tail -n 160
            if adb logcat -d -v brief -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              echo "ANDROID APP CRASHED ON LAUNCH"
              exit 1
            fi
            echo "No fatal exception detected (browser rendering still requires manual validation)"
