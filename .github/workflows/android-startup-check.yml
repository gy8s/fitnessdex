name: Android startup smoke (emulator)

on:
  workflow_dispatch:
  push:
    branches: [fix/android-startup-crash]
    paths:
      - 'android-steps/**'
      - '.github/workflows/android-startup-check.yml'

permissions:
  contents: read

jobs:
  launch-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build
        run: gradle -p android-steps :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator, install and open FitnessDex
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell input keyevent 82
            adb install -r android-steps/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -Ei 'chrome|browser'
            adb logcat -c
            adb shell am start -W -n io.github.gy8s.fitnessdex.steps/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 7
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|ResumedActivity' | head -n 8
            adb logcat -d -v time -s AndroidRuntime:E ActivityTaskManager:I ActivityTaskManager:W TWALauncherActivity:D TwaLauncher:D TwaProviderPicker:D | tail -n 130
            adb logcat -d -v time | grep -Ei 'FATAL EXCEPTION|Unable to start|AndroidRuntime|TWALauncher|TwaProviderPicker|ActivityNotFound|NoActivity|No Activity found|com.google.androidbrowserhelper|custom.tabs' | tail -n 150 || true
            adb shell monkey -p com.android.chrome -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|ResumedActivity' | head -n 5
            adb shell am start -W -n io.github.gy8s.fitnessdex.steps/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 7
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|ResumedActivity' | head -n 8
            adb logcat -d -v time -s AndroidRuntime:E TWALauncherActivity:D TwaLauncher:D TwaProviderPicker:D | tail -n 170
            adb shell am start -W -n io.github.gy8s.fitnessdex.steps/.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|ResumedActivity' | head -n 8
            adb logcat -d -v time -s AndroidRuntime:E | tail -n 150
