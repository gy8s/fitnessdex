name: Build FitnessDex Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-steps/**'
      - '.github/workflows/steps-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FitnessDex
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android-steps :app:assembleDebug --no-daemon --stacktrace
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessDex-Android-APK
          path: android-steps/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="android-steps/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view fitnessdex-android-v0.2.2 >/dev/null 2>&1; then
            gh release upload fitnessdex-android-v0.2.2 "$APK#FitnessDex-Android.apk" --clobber
          else
            gh release create fitnessdex-android-v0.2.2 "$APK#FitnessDex-Android.apk" \
              --title "FitnessDex Android 0.2.2" \
              --notes "One Android app with FitnessDex game through Chrome plus native Health Connect steps, cloud saves and web push preserved. Debug-signed prototype; stable future updates require a permanent private signing key."
          fi
