name: Build FitnessDex Steps Android companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-steps/**'
      - '.github/workflows/steps-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FitnessDex
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android-steps :app:assembleDebug --no-daemon --stacktrace
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessDex-Steps-APK
          path: android-steps/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="android-steps/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view fitnessdex-steps-v0.1.1 >/dev/null 2>&1; then
            gh release upload fitnessdex-steps-v0.1.1 "$APK#FitnessDex-Steps.apk" --clobber
          else
            gh release create fitnessdex-steps-v0.1.1 "$APK#FitnessDex-Steps.apk" \
              --title "FitnessDex Steps companion 0.1.1" \
              --notes "Detect missing Health Connect data instead of uploading false zeros; refresh on reopen and approximate 30-minute optional background sync. Debug-signed APK may require reinstalling and re-pairing."
          fi
