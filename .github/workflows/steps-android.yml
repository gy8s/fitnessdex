name: Build FitnessDex Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-steps/**'
      - '.github/workflows/steps-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FitnessDex
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android APK
        run: gradle -p android-steps :app:assembleDebug --no-daemon --stacktrace
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessDex-Android-APK
          path: android-steps/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="android-steps/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view fitnessdex-android-v1.0.1 >/dev/null 2>&1; then
            echo "Immutable signed APK already exists: do not overwrite or re-sign this release."
            exit 0
          fi
          gh release create fitnessdex-android-v1.0.1 "$APK#FitnessDex-Android.apk" \
            --title "FitnessDex Android 1.0.1" \
            --notes "Single-install testing release. FitnessDex v1.0.1 website, native Health Connect setup and step syncing. Debug signed: future seamless APK updates require a permanent private signing key."
