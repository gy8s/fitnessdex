          CERTIFICATE
          openssl cms -encrypt -binary -aes-256-cbc -stream -outform DER \
            -in "$proof/after.apk" -out "$proof/FitnessDex-Android.apk.cms" "$cert"
      - name: Store the encrypted phone APK for delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fitnessdex-private-phone-copy
          path: ${{ runner.temp }}/fitnessdex-signing-proof/FitnessDex-Android.apk.cms
          if-no-files-found: error
          retention-days: 1
